<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- 앱 헤더 -->
    <header class="app-header">
      <h1 class="app-title">Todo</h1>
      <p class="app-subtitle">오늘 할 일을 정리하세요</p>
    </header>

    <!-- 날짜 네비게이션 -->
    <section class="date-nav">
      <button id="prevDateButton" class="btn btn-date-nav" aria-label="이전 날짜">&#8249;</button>

      <div class="date-display-wrapper">
        <!-- 클릭하면 달력 팝업이 열린다 -->
        <span id="dateDisplay" class="date-display" title="클릭하면 달력이 열립니다"></span>
        <button id="todayButton" class="btn btn-today">오늘</button>

        <!-- 달력 팝업 (date-display-wrapper 기준 절대 위치) -->
        <div id="calendarPopup" class="calendar-popup hidden">
          <div class="calendar-header">
            <button id="prevMonthButton" class="btn-cal-nav">&#8249;</button>
            <span id="calendarTitle" class="calendar-title"></span>
            <button id="nextMonthButton" class="btn-cal-nav">&#8250;</button>
          </div>
          <div class="calendar-weekdays">
            <span>일</span><span>월</span><span>화</span><span>수</span>
            <span>목</span><span>금</span><span>토</span>
          </div>
          <div id="calendarDays" class="calendar-days"></div>
        </div>
      </div>

      <button id="nextDateButton" class="btn btn-date-nav" aria-label="다음 날짜">&#8250;</button>
    </section>

    <!-- Todo 입력 영역 -->
    <section class="input-section">
      <div class="input-wrapper">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="할 일을 입력하세요"
          maxlength="100"
        />
        <button id="addButton" class="btn btn-add">추가</button>
      </div>
      <!-- 마감 시간 입력 (선택) -->
      <div class="due-wrapper">
        <label for="dueInput" class="due-label">마감</label>
        <input type="datetime-local" id="dueInput" class="due-input" />
      </div>
      <p id="errorMessage" class="error-message hidden">할 일을 입력해주세요.</p>
    </section>

    <!-- Todo 목록 영역 -->
    <section class="list-section">
      <ul id="todoList" class="todo-list"></ul>
      <p id="emptyMessage" class="empty-message">등록된 할 일이 없습니다.</p>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
